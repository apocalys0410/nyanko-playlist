<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f0e8;
    --paper: #faf7f2;
    --ink: #2a2015;
    --ink-muted: #7a6e5f;
    --ink-faint: #b8aa96;
    --accent: #8b5e3c;
    --accent-light: #e8d5c0;
    --green: #4a6741;
    --green-light: #dce8d4;
    --line: #ddd5c5;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
    min-height: 100vh;
  }

  .noise {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.5;
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 580px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header { text-align: center; margin-bottom: 36px; }

  .kana {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--ink-faint);
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 26px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .sub { font-size: 12px; color: var(--ink-muted); letter-spacing: 0.05em; }

  /* Tabs */
  .tabs-wrap {
    margin-bottom: 20px;
  }

  /* Each row scrolls independently */
  .tabs {
    display: flex;
    gap: 6px;
    padding-bottom: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-light) transparent;
    cursor: grab;
  }
  .tabs::-webkit-scrollbar { height: 4px; }
  .tabs::-webkit-scrollbar-track { background: transparent; }
  .tabs::-webkit-scrollbar-thumb { background: var(--accent-light); border-radius: 4px; }

  .tabs-row2 {
    margin-top: 4px;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border: 0.5px solid var(--line);
    border-radius: 20px;
    background: var(--paper);
    cursor: pointer;
    font-family: 'Noto Serif JP', serif;
    font-size: 12px;
    color: var(--ink-muted);
    white-space: nowrap;
    transition: all 0.2s;
    user-select: none;
    flex-shrink: 0;
  }

  .tab:hover { border-color: var(--accent-light); color: var(--ink); }

  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .tab .icon { font-size: 13px; }

  /* Panels */
  .panel { display: none; }
  .panel.active { display: block; }

  /* List */
  .list { display: flex; flex-direction: column; gap: 6px; }

  .item {
    display: flex; align-items: center;
    background: var(--paper);
    border: 0.5px solid var(--line);
    border-radius: 4px;
    padding: 13px 14px;
    gap: 12px;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.2s, background 0.2s;
  }

  .item:hover { border-color: var(--accent-light); background: #fff; }

  .num {
    font-size: 11px;
    color: var(--ink-faint);
    min-width: 16px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .info { flex: 1; min-width: 0; }

  .name {
    font-family: 'Shippori Mincho', serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
    transition: color 0.2s;
  }

  .tag { font-size: 13px; color: var(--ink-muted); }

  .play-btn {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--accent-light);
    transition: background 0.2s, transform 0.15s;
  }

  .play-btn svg { width: 11px; height: 11px; pointer-events: none; }
  .play-btn svg path { fill: var(--accent); transition: fill 0.2s; }

  .item:hover .play-btn { background: var(--accent); transform: scale(1.08); }
  .item:hover .play-btn svg path { fill: #fff; }

  .item.active {
    border-color: var(--green);
    background: var(--green-light);
  }
  .item.active:hover { background: var(--green-light); border-color: var(--green); }
  .item.active .name { color: var(--green); }
  .item.active .play-btn { background: var(--green); }
  .item.active .play-btn svg path { fill: #fff; }
  .item.active:hover .play-btn { transform: scale(1.08); }

  .divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 0.5px; background: var(--line);
  }
  .divider span { font-size: 12px; color: var(--ink-faint); }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }


  /* Filters */
  .filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .frow { display: flex; align-items: center; gap: 8px; }
  .flabel { flex-shrink: 0; width: 34px; font-size: 11px; color: var(--ink-faint); letter-spacing: 0.1em; }
  .frow .tabs { flex: 1; min-width: 0; padding-bottom: 2px; }
  .tabs.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); }
  #count b { font-weight: 400; color: var(--ink-muted); }
  button.play-btn { border: 0; padding: 0; cursor: pointer; }
  .play-btn.open { background: var(--accent); }
  .play-btn.open svg path { fill: #fff; }
  .fav-btn { flex-shrink: 0; width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .fav-btn svg { width: 14px; height: 14px; fill: none; stroke: var(--ink-faint); stroke-width: 1.4; transition: transform 0.2s; }
  .fav-btn:hover svg { stroke: #c96f6a; }
  .fav-btn.on svg { fill: #c96f6a; stroke: #c96f6a; }
  .fav-btn:active svg { transform: scale(1.25); }
  .item .hide-btn, .item .fav-btn { margin-right: -6px; }
  .group-label { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.1em; margin: 6px 2px 0; }
  .group-label:first-child { margin-top: 0; }
  .embed { margin: -2px 0 4px; border-radius: 12px; overflow: hidden; background: var(--paper); }
  .embed iframe { display: block; width: 100%; border: 0; }
  .shuffle { display: inline-flex; align-items: center; gap: 5px; }
  .shuffle svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.4s; }
  .shuffle:hover svg { transform: rotate(180deg); }
  .shuffle .pg { font-size: 10px; opacity: 0.6; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .tab { font: inherit; font-size: 12px; }
  .meta-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ink-faint); margin: 14px 0 10px; }
  .linkish { background: none; border: 0; padding: 0; font: inherit; font-size: 11px; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  a.item { color: inherit; text-decoration: none; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px; margin-left: 6px; border-radius: 8px; background: var(--green-light); color: var(--green); vertical-align: 2px; font-family: 'Noto Serif JP', serif; font-weight: 400; }
  .chips { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .empty { text-align: center; padding: 28px 12px; font-size: 13px; color: var(--ink-muted); border: 0.5px dashed var(--line); border-radius: 4px; }
  .section-title { font-family: 'Shippori Mincho', serif; font-size: 17px; font-weight: 500; margin: 36px 0 12px; }
  .actions { display: flex; gap: 14px; align-items: center; }
  .shuffle { background: var(--accent-light); color: var(--accent); border: 0; border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .shuffle:active { transform: scale(0.96); }
  .hide-btn { flex-shrink: 0; width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-faint); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .hide-btn:hover { background: var(--accent-light); color: var(--accent); }
  .item, .tab, .shuffle, .hide-btn, .linkish { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .tabs { scroll-snap-type: x proximity; overscroll-behavior-x: contain; }
  .tab { scroll-snap-align: start; }
  .petal { will-change: transform; }
  @media (hover: none) {
    .item:hover { border-color: var(--line); background: var(--paper); }
    .item:hover .play-btn { transform: none; background: var(--accent-light); }
    .item:hover .play-btn svg path { fill: var(--accent); }
    .item:active { background: #fff; }
  }
  @media (max-width: 480px) {
    .wrap { padding: 28px 16px 64px; }
    h1 { font-size: 22px; }
    .tab { padding: 9px 14px; font-size: 13px; }
    .item { padding: 14px 10px 14px 12px; gap: 10px; }
    .name { font-size: 14px; }
    .tabs { scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
  }
  .section-title small { font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-left: 8px; }

  /* Sakura */
  .sakura-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 999; overflow: hidden;
  }
  .petal {
    position: absolute;
    top: -40px;
    font-size: 18px;
    opacity: 0.75;
    animation: fall linear infinite;
    user-select: none;
  }
  @keyframes fall {
    0%   { transform: translateY(-60px) rotate(0deg) translateX(0); opacity: 0; }
    8%   { opacity: 0.75; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(110vh) rotate(360deg) translateX(60px); opacity: 0; }
  }
  .petal {
    animation-fill-mode: both;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1610;
      --paper: #221e18;
      --ink: #e8dfc8;
      --ink-muted: #9a8e7a;
      --ink-faint: #5a5248;
      --accent: #c49060;
      --accent-light: #3a2e22;
      --green: #7aaa6a;
      --green-light: #1e2e1a;
      --line: #322c24;
    }
    .item:hover { background: #2a2620; }
    .tab.active { color: #1a1610; }
  }
</style>
</head>

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let catQueue = shuffle(catImgs);
  let activeCats = 0;
  const MAX_CATS = 3;

  function spawnCat() {
    if (activeCats >= MAX_CATS) {
      setTimeout(spawnCat, 2000);
      return;
    }
    if (catQueue.length === 0) catQueue = shuffle(catImgs);
    activeCats++;
    const p = document.createElement('div');
    p.className = 'petal';

    const img = document.createElement('img');

    const zones = [[5, 28], [35, 58], [65, 88]];

    p.style.left = (zone[0] + Math.random() * (zone[1] - zone[0])) + 'vw';

    p.style.animationDuration = dur + 's';
    p.style.animationDelay = '0s';
    p.style.opacity = 0.9;
    sakura.appendChild(p);

      activeCats--;
      // Immediately try to spawn next so screen always has 2
      setTimeout(spawnCat, 500 + Math.random() * 1000);
    }, dur * 1000);
  }

    const key = b.dataset.preview;
    document.querySelectorAll('.embed').forEach(x => x.remove());
    document.querySelectorAll('.play-btn.open').forEach(x => x.classList.remove('open'));
    if (openKey === key) { openKey = null; return; }
    openKey = key;
    const [type, id] = key.split(':');
    b.classList.add('open');
    b.closest('a.item').insertAdjacentHTML('afterend', embedHTML(type, id));
  }, true);
  // Clicking a row follows its link (opens Spotify); remember it as last played
  document.addEventListener('click', e => {
    const a = e.target.closest('a.item');
    if (!a || e.target.closest('button')) return;
    lastPlayed = a.dataset.key;
    store.set('nyanko-last', lastPlayed);
    document.querySelectorAll('a.item.active').forEach(i => i.classList.remove('active'));
    a.classList.add('active');
  });

  // Fade the right edge while a row still has chips hidden off-screen
  function updateFade(row) { row.classList.toggle('more', row.scrollLeft + row.clientWidth < row.scrollWidth - 4); }
  window.addEventListener('resize', () => document.querySelectorAll('.tabs').forEach(updateFade));

  // Mousewheel + drag to scroll chip rows (rows are re-rendered, so bind once per element)
  function bindScroll() {
    document.querySelectorAll('.tabs').forEach(row => {
      if (row.dataset.bound) return;
      row.dataset.bound = '1';
      updateFade(row);
      row.addEventListener('scroll', () => updateFade(row), { passive: true });
      row.addEventListener('wheel', (e) => {
        if (row.scrollWidth <= row.clientWidth || Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
        e.preventDefault(); row.scrollLeft += e.deltaY;
      }, { passive: false });
      let down = false, moved = false, startX, startLeft;
      row.addEventListener('mousedown', (e) => { down = true; moved = false; startX = e.pageX; startLeft = row.scrollLeft; });
      window.addEventListener('mouseup', () => { down = false; row.style.cursor = ''; });
      row.addEventListener('mousemove', (e) => {
        if (!down) return;
        const dx = e.pageX - startX;
        if (Math.abs(dx) > 4) { moved = true; row.style.cursor = 'grabbing'; row.scrollLeft = startLeft - dx; }
      });
      // a drag shouldn't also count as a click on a chip
      row.addEventListener('click', (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
    });
  }

  rebuildOrder(); renderFilters(); renderPlaylists(); renderArtists(); bindScroll();
</script>
</body>
</html>
