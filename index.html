<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☕ 放鬆音樂歌單</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="noise"></div>
<div class="wrap">

  <header>
    <p class="kana">放鬆音樂歌單 · Relaxing Music</p>
    <h1>☕ 咖啡時光</h1>
    <div class="greet-row"><p class="greet" id="greet"></p><div class="voice" id="voice"><button type="button" class="tab" data-voice="zh" aria-label="貓咪老師說中文">中</button><button type="button" class="tab" data-voice="ja" aria-label="貓咪老師說日本語">日</button></div><button type="button" class="tab rain-btn" id="rain-btn" aria-pressed="false" title="下雨模式">🌧</button></div>
    <p class="sub">▶ 試聽 · 點整列開 Spotify · 點飄下來的貓咪老師有驚喜 🐾</p>
  </header>

  <nav class="views" id="views" role="tablist">
    <button type="button" role="tab" data-view="playlists">🎧 歌單</button>
    <button type="button" role="tab" data-view="artists">🎤 歌手</button>
  </nav>

  <section id="view-playlists" role="tabpanel">
    <div class="filters" id="filters"></div>
    <div class="meta-bar"><span id="count"></span><div class="actions"><button class="linkish" id="unhide" type="button" hidden></button><button class="linkish" id="reset" type="button">清除篩選</button><button class="shuffle" id="shuffle" type="button">🔀 換一批</button></div></div>
    <div class="pomo" id="pomo" hidden></div>
    <div class="list" id="playlist-list"></div>
  </section>

  <section id="view-artists" role="tabpanel" hidden>
    <div class="frow"><div class="tabs" id="artist-tabs"></div></div>
    <p class="artist-hint">點了會開啟歌手頁 · ▶ 先試聽熱門歌</p>
    <div class="list" id="artist-list"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
  <footer>
    <button type="button" class="dex-btn" id="dex-btn"></button>
    <div class="open-pref" id="open-pref">
      <span>電腦點整列開啟</span>
      <button type="button" class="tab" data-open="app">桌面 App</button>
      <button type="button" class="tab" data-open="web">網頁版</button>
    </div>
    <p id="open-hint"></p>
  </footer>

</div>
<!-- After the content so falling cats come last in Tab order; it is position: fixed, so it still draws on top -->
<div class="sakura-container" id="sakura"></div>

<script src="js/data.js"></script>
<script src="js/nyanko.js"></script>
<script src="js/app.js"></script>
<script src="js/pomodoro.js"></script>
</body>
</html>
