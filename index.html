<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☕ 放鬆音樂歌單</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="noise"></div>
<div class="sakura-container" id="sakura"></div>
<div class="wrap">

  <header>
    <p class="kana">放鬆音樂歌單 · Relaxing Music</p>
    <h1>☕ 咖啡時光</h1>
    <p class="sub">點 ▶ 直接在這裡試聽，點整列到 Spotify 開啟</p>
    <p class="greet" id="greet"></p>
    <div class="voice" id="voice"><span>貓咪老師說</span><button type="button" class="tab" data-voice="zh">中文</button><button type="button" class="tab" data-voice="ja">日本語</button></div>
    <p class="cat-hint">試試點一下飄下來的貓咪老師 🐾</p>
  </header>

  <div class="filters" id="filters"></div>
  <div class="meta-bar"><span id="count"></span><div class="actions"><button class="linkish" id="unhide" type="button" hidden></button><button class="linkish" id="reset" type="button">清除篩選</button><button class="shuffle" id="shuffle" type="button">🔀 換一批</button></div></div>
  <div class="pomo" id="pomo" hidden></div>
  <div class="list" id="playlist-list"></div>

  <h2 class="section-title">探索歌手<small>點了會開啟歌手頁</small></h2>
  <div class="frow"><div class="tabs" id="artist-tabs"></div></div>
  <div class="list" id="artist-list" style="margin-top:12px"></div>

  <div class="toast" id="toast" role="status" hidden></div>
  <footer>
    <div class="open-pref" id="open-pref">
      <span>電腦點整列開啟</span>
      <button type="button" class="tab" data-open="app">桌面 App</button>
      <button type="button" class="tab" data-open="web">網頁版</button>
    </div>
    <p id="open-hint"></p>
  </footer>

</div>

<script src="js/data.js"></script>
<script src="js/nyanko.js"></script>
<script src="js/app.js"></script>
<script src="js/pomodoro.js"></script>
</body>
</html>
